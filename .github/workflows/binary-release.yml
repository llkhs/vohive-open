name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'debug/**'
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string used when manually triggered'
        required: false
        default: 'dev'
      enable_upx:
        description: 'Enable UPX compression (true/false)'
        required: false
        default: 'false'
      publish_release:
        description: 'Publish a GitHub Release for this manual build'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Build frontend assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.artifact_arch }}
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ''
            artifact_arch: amd64
          - goarch: arm64
            goarm: ''
            artifact_arch: arm64
          - goarch: arm
            goarm: '7'
            artifact_arch: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare build vars
        id: vars
        shell: bash
        run: |
          COMMIT_HASH="$(git rev-parse HEAD 2>/dev/null || echo '${{ github.sha }}')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version || 'dev' }}"
          fi
          BUILDTIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ENABLE_UPX_RAW="${{ github.event.inputs.enable_upx || 'false' }}"
          case "${ENABLE_UPX_RAW}" in
            true|1|yes|on) ENABLE_UPX=1 ;;
            *) ENABLE_UPX=0 ;;
          esac
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "commit=${COMMIT_HASH}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${SHORT_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "buildtime=${BUILDTIME}" >> "${GITHUB_OUTPUT}"
          echo "enable_upx=${ENABLE_UPX}" >> "${GITHUB_OUTPUT}"

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Sync frontend dist for embed
        shell: bash
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web
          cp -R web/dist internal/web/dist

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" \
            -ldflags "-s -w -X 'github.com/iniwex5/vohive/internal/global.Version=${{ steps.vars.outputs.version }}' -X 'github.com/iniwex5/vohive/internal/global.GitCommit=${{ steps.vars.outputs.commit }}' -X 'github.com/iniwex5/vohive/internal/global.BuildTime=${{ steps.vars.outputs.buildtime }}'" \
            -o dist/vo-hive ./cmd/vohive
          if [ -d "./cmd/lock-band3" ]; then
            GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
              go build -trimpath -buildvcs=false \
              -ldflags "-s -w" \
              -o dist/lock-band3 ./cmd/lock-band3 || true
          fi

      - name: Install UPX
        if: ${{ steps.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Compress with UPX
        if: ${{ steps.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          upx --best --lzma dist/vo-hive || upx -9 dist/vo-hive

      - name: Package artifact
        shell: bash
        run: |
          SHORT_SHA="${{ steps.vars.outputs.short_commit }}"
          OUT_HASH="vohive_${{ steps.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}_${SHORT_SHA}"
          OUT_STD="vohive_${{ steps.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}"
          mkdir -p out

          # 产物带上版本短哈希
          cp dist/vo-hive "out/${OUT_HASH}"
          sha256sum "out/${OUT_HASH}" > "out/${OUT_HASH}.sha256"
          # 同步保留标准名称文件副本，方便固定脚本通用下载
          cp dist/vo-hive "out/${OUT_STD}"
          sha256sum "out/${OUT_STD}" > "out/${OUT_STD}.sha256"

          if [ -f "dist/lock-band3" ]; then
            LOCK_OUT="lock-band3_${{ matrix.artifact_arch }}"
            LOCK_OUT_HASH="lock-band3_${{ matrix.artifact_arch }}_${SHORT_SHA}"
            cp dist/lock-band3 "out/${LOCK_OUT_HASH}"
            sha256sum "out/${LOCK_OUT_HASH}" > "out/${LOCK_OUT_HASH}.sha256"
            cp dist/lock-band3 "out/${LOCK_OUT}"
            sha256sum "out/${LOCK_OUT}" > "out/${LOCK_OUT}.sha256"
          fi

          if [ "${{ matrix.artifact_arch }}" == "arm64" ]; then
            BUNDLE_DIR="vohive_sp970_arm64"
            mkdir -p "${BUNDLE_DIR}"
            cp dist/vo-hive "${BUNDLE_DIR}/vohive"
            [ -f "dist/lock-band3" ] && cp dist/lock-band3 "${BUNDLE_DIR}/lock-band3"
            [ -f "scripts/mcc-mnc-table.json" ] && cp scripts/mcc-mnc-table.json "${BUNDLE_DIR}/"
            [ -f "scripts/install.sh" ] && cp scripts/install.sh "${BUNDLE_DIR}/"
            [ -f "scripts/install_fixed.sh" ] && cp scripts/install_fixed.sh "${BUNDLE_DIR}/"
            [ -f "scripts/fix-modem-allnet.sh" ] && cp scripts/fix-modem-allnet.sh "${BUNDLE_DIR}/"
            mkdir -p "${BUNDLE_DIR}/hardware"
            [ -f "scripts/hardware/sp970-setup.sh" ] && cp scripts/hardware/sp970-setup.sh "${BUNDLE_DIR}/hardware/"
            [ -f "scripts/hardware/fix-cpu-loop.sh" ] && cp scripts/hardware/fix-cpu-loop.sh "${BUNDLE_DIR}/hardware/"

            # 打包带版本哈希与标准命名的 bundle
            tar -czvf "out/vohive_sp970_arm64_bundle_${SHORT_SHA}.tar.gz" "${BUNDLE_DIR}"
            sha256sum "out/vohive_sp970_arm64_bundle_${SHORT_SHA}.tar.gz" > "out/vohive_sp970_arm64_bundle_${SHORT_SHA}.tar.gz.sha256"
            cp "out/vohive_sp970_arm64_bundle_${SHORT_SHA}.tar.gz" "out/vohive_sp970_arm64_bundle.tar.gz"
            sha256sum "out/vohive_sp970_arm64_bundle.tar.gz" > "out/vohive_sp970_arm64_bundle.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_arch }}
          path: out/*
          retention-days: 3

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
    steps:
      - name: Prepare release vars
        id: release_vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
            IS_PRERELEASE="false"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="${{ github.event.inputs.version || 'dev' }}"
            IS_PRERELEASE="false"
          else
            RELEASE_VERSION="dev"
            IS_PRERELEASE="true"
          fi
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Publish to this GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.release_version }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ steps.release_vars.outputs.is_prerelease == 'true' }}
