name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string used when manually triggered'
        required: false
        default: 'dev'
      enable_upx:
        description: 'Enable UPX compression (true/false)'
        required: false
        default: 'false'
      publish_release:
        description: 'Publish a GitHub Release for this manual build'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build frontend assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.artifact_arch }}
    runs-on: ubuntu-24.04
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ''
            artifact_arch: amd64
          - goarch: arm64
            goarm: ''
            artifact_arch: arm64
          - goarch: arm
            goarm: '7'
            artifact_arch: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare build vars
        id: vars
        shell: bash
        run: |
          COMMIT_HASH="$(git rev-parse HEAD 2>/dev/null || echo '${{ github.sha }}')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version || 'dev' }}"
          fi
          BUILDTIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ENABLE_UPX_RAW="${{ github.event.inputs.enable_upx || 'false' }}"
          case "${ENABLE_UPX_RAW}" in
            true|1|yes|on) ENABLE_UPX=1 ;;
            *) ENABLE_UPX=0 ;;
          esac
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "commit=${COMMIT_HASH}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${SHORT_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "buildtime=${BUILDTIME}" >> "${GITHUB_OUTPUT}"
          echo "enable_upx=${ENABLE_UPX}" >> "${GITHUB_OUTPUT}"

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Sync frontend dist for embed
        shell: bash
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web
          cp -R web/dist internal/web/dist

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" \
            -ldflags "-s -w -X 'github.com/iniwex5/vohive/internal/global.Version=${{ steps.vars.outputs.version }}' -X 'github.com/iniwex5/vohive/internal/global.GitCommit=${{ steps.vars.outputs.commit }}' -X 'github.com/iniwex5/vohive/internal/global.BuildTime=${{ steps.vars.outputs.buildtime }}'" \
            -o dist/vo-hive ./cmd/vohive
          # lock-band3 仅为高通 MSM8916 (arm64) 随身 WiFi 工具，仅构建 arm64 架构
          if [ "${{ matrix.artifact_arch }}" == "arm64" ] && [ -d "./cmd/lock-band3" ]; then
            GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
              go build -trimpath -buildvcs=false \
              -ldflags "-s -w" \
              -o dist/lock-band3 ./cmd/lock-band3 || true
          fi

      - name: Install UPX
        if: ${{ steps.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Compress with UPX
        if: ${{ steps.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          upx --best --lzma dist/vo-hive || upx -9 dist/vo-hive

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p out
          OUT="vohive_${{ steps.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}"

          # 统一标准文件命名（无重复冗余）
          cp dist/vo-hive "out/${OUT}"
          sha256sum "out/${OUT}" > "out/${OUT}.sha256"

          # lock-band3 仅随 arm64 提供独立产物
          if [ "${{ matrix.artifact_arch }}" == "arm64" ] && [ -f "dist/lock-band3" ]; then
            LOCK_OUT="lock-band3_arm64"
            cp dist/lock-band3 "out/${LOCK_OUT}"
            sha256sum "out/${LOCK_OUT}" > "out/${LOCK_OUT}.sha256"
          fi

          # 为高通 410 (MSM8916 / OpenStick 全系: UFI001C, UFI003, SP970, UZ801 等) 提供一站式全量解压即用包
          if [ "${{ matrix.artifact_arch }}" == "arm64" ]; then
            BUNDLE_DIR="vohive_openstick_arm64"
            mkdir -p "${BUNDLE_DIR}"
            cp dist/vo-hive "${BUNDLE_DIR}/vohive"
            [ -f "dist/lock-band3" ] && cp dist/lock-band3 "${BUNDLE_DIR}/lock-band3"
            [ -f "scripts/mcc-mnc-table.json" ] && cp scripts/mcc-mnc-table.json "${BUNDLE_DIR}/"
            [ -f "scripts/install.sh" ] && cp scripts/install.sh "${BUNDLE_DIR}/"
            [ -f "scripts/fix-modem-allnet.sh" ] && cp scripts/fix-modem-allnet.sh "${BUNDLE_DIR}/"
            mkdir -p "${BUNDLE_DIR}/hardware"
            [ -f "scripts/hardware/openstick-msm8916-setup.sh" ] && cp scripts/hardware/openstick-msm8916-setup.sh "${BUNDLE_DIR}/hardware/"
            [ -f "scripts/hardware/sp970-setup.sh" ] && cp scripts/hardware/sp970-setup.sh "${BUNDLE_DIR}/hardware/"
            [ -f "scripts/hardware/fix-cpu-loop.sh" ] && cp scripts/hardware/fix-cpu-loop.sh "${BUNDLE_DIR}/hardware/"

            # 打包标准通用全量包
            tar -czvf "out/vohive_openstick_arm64_bundle.tar.gz" "${BUNDLE_DIR}"
            sha256sum "out/vohive_openstick_arm64_bundle.tar.gz" > "out/vohive_openstick_arm64_bundle.tar.gz.sha256"

            # 保持对旧名称 vohive_sp970_arm64_bundle 的向后兼容发布
            cp "out/vohive_openstick_arm64_bundle.tar.gz" "out/vohive_sp970_arm64_bundle.tar.gz"
            cp "out/vohive_openstick_arm64_bundle.tar.gz.sha256" "out/vohive_sp970_arm64_bundle.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_arch }}
          path: out/*
          retention-days: 3

  release:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release vars
        id: release_vars
        shell: bash
        run: |
          COMMIT_HASH="$(git rev-parse HEAD 2>/dev/null || echo '${{ github.sha }}')"
          SHORT_SHA="${COMMIT_HASH:0:7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="${GITHUB_REF_NAME}"
            IS_PRERELEASE="false"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ github.event.inputs.version || 'dev' }}"
            RELEASE_NAME="Dev Build (${SHORT_SHA})"
            IS_PRERELEASE="true"
          else
            RELEASE_TAG="dev"
            RELEASE_NAME="Dev Build (${SHORT_SHA})"
            IS_PRERELEASE="true"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "commit_hash=${COMMIT_HASH}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        shell: bash
        run: |
          BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cat << EOF > release_body.md
          ### VoHive 自动构建发布

          - **版本状态**: \`${{ steps.release_vars.outputs.release_tag }}\`
          - **提交哈希**: [${{ steps.release_vars.outputs.short_sha }}](https://github.com/${{ github.repository }}/commit/${{ steps.release_vars.outputs.commit_hash }})
          - **构建时间**: \`${BUILD_TIME}\`

          #### 资产下载指南
          | 文件名称 | 说明 |
          | :--- | :--- |
          | **\`vohive_sp970_arm64_bundle.tar.gz\`** | **高通 410 (SP970-B-V13) 随身 WiFi 一站式全量包**（预装主程序、频段锁、离线字典及硬件加固脚本） |
          | **\`vohive_${{ steps.release_vars.outputs.release_tag }}_linux_arm64\`** | Linux 64位 ARM (ARM64 / aarch64) 单可执行文件 |
          | **\`vohive_${{ steps.release_vars.outputs.release_tag }}_linux_amd64\`** | Linux 64位 x86_64 (amd64) 单可执行文件 |
          | **\`vohive_${{ steps.release_vars.outputs.release_tag }}_linux_armv7\`** | Linux 32位 ARM (armv7) 单可执行文件 |
          | **\`lock-band3_arm64\`** | 高通 410 (MSM8916) 专用 LTE Band 1+3 频段锁独立工具 |

          > 校验码可在对应的 \`.sha256\` 文件中查看验证。
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Publish to this GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.release_tag }}
          name: ${{ steps.release_vars.outputs.release_name }}
          body_path: release_body.md
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ steps.release_vars.outputs.is_prerelease == 'true' }}
